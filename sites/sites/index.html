<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&family=Open+Sans&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Open Sans', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f0f0f0;
      perspective: 1000px;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-gap: 40px;
      max-width: 1000px;
      width: 80%;
      transform: rotateX(10deg) rotateY(-10deg);
    }

    .box {
      background-color: #3498db;
      padding: 30px;
      text-align: center;
      border-radius: 15px;
      cursor: pointer;
      text-decoration: none;
      color: #fff;
      position: relative;
      max-width: 95%;
      transition: all 0.2s ease-in-out;
      box-shadow: 
        0 15px 0 #2980b9,
        0 20px 20px rgba(0,0,0,0.2);
      transform: translateZ(0);
    }

    .box:nth-child(2) { background-color: #e74c3c; box-shadow: 0 15px 0 #c0392b, 0 20px 20px rgba(0,0,0,0.2); }
    .box:nth-child(3) { background-color: #2ecc71; box-shadow: 0 15px 0 #27ae60, 0 20px 20px rgba(0,0,0,0.2); }
    
    .box.red {
        background-color: #e74c3c;
        box-shadow: 0 15px 0 #c0392b, 0 20px 20px rgba(0,0,0,0.2);
    }

    .box.red:active {
        box-shadow: 0 5px 0 #c0392b, 0 10px 10px rgba(0,0,0,0.2);
    }
    
    .box.green {
        background-color: #2ecc71;
        box-shadow: 0 15px 0 #27ae60, 0 20px 20px rgba(0,0,0,0.2);
    }

    .box.green:hover {
        transform: translateY(-5px) translateZ(0);
    }

    .box.green:active {
        transform: translateY(10px) translateZ(-10px);
        box-shadow: 0 5px 0 #27ae60, 0 10px 10px rgba(0,0,0,0.2);
    }

    .box.pink {
        background-color: #e84393;
        box-shadow: 0 15px 0 #b8326f, 0 20px 20px rgba(0,0,0,0.2);
    }

    .box.pink:active {
        box-shadow: 0 5px 0 #b8326f, 0 10px 10px rgba(0,0,0,0.2);
    }

    .box:hover {
      transform: translateY(-5px) translateZ(0);
    }

    .box:active {
      transform: translateY(10px) translateZ(-10px);
      box-shadow: 
        0 5px 0 #2980b9,
        0 10px 10px rgba(0,0,0,0.2);
    }

    .box:nth-child(2):active { box-shadow: 0 5px 0 #c0392b, 0 10px 10px rgba(0,0,0,0.2); }
    .box:nth-child(3):active { box-shadow: 0 5px 0 #27ae60, 0 10px 10px rgba(0,0,0,0.2); }

    .box h2 {
      font-family: 'Roboto', sans-serif;
      font-size: 28px;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .box p {
      font-size: 16px;
      opacity: 0.8;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="https://roadracer.donovans.se" class="box" target="_blank">
      <h2>Road racer</h2>
      <p>Click to visit</p>
     </a>    
    <a href="https://bilkalkyl.donovans.se" class="box" target="_blank">
      <h2>Bilkalkyl</h2>
      <p>Click to visit</p>
     </a>
    <a href="https://uteluft.donovans.se" class="box" target="_blank">
      <h2>Uteluft</h2>
      <p>Click to visit</p>
    </a>
    <a href="https://acetime.donovans.se" class="box" target="_blank">
      <h2>Acetime</h2>
      <p>Click to visit</p>
    </a>
    <a href="https://todo.donovans.se" class="box red" target="_blank">
      <h2>Todo</h2>
      <p>Click to visit</p>
    </a>
    <a href="https://donovans.se/uttryck" class="box green" target="_blank">
      <h2>Uttryck</h2>
      <p>Click to visit</p>
    </a>
    <a href="https://enhorningsspelet.donovans.se" class="box pink" target="_blank">
      <h2>Enhörningsspelet</h2>
      <p>Click to visit</p>
    </a>
  </div>
</body>
</html>
