name: Inspect one.com folder (read-only)

# Prints the file list and the text files of a folder on one.com, so a site
# that only exists on the server can be brought under version control.
# Read-only: downloads to the runner, never writes to one.com.

on:
  workflow_dispatch:
    inputs:
      path:
        description: "Folder on one.com, e.g. webroots/www/sites/"
        required: true
        default: "webroots/www/sites/"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download and print
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
          REMOTE: ${{ github.event.inputs.path }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          mkdir -p dl
          lftp -e "set sftp:auto-confirm true; open -u \"$SFTP_USER\",\"$SFTP_PASS\" sftp://$SFTP_HOST:22; mirror --verbose \"$REMOTE\" ./dl; bye"
          echo "=== FILES ==="
          (cd dl && find . -type f -printf '%s\t%p\n' | sort -k2)
          for f in $(cd dl && find . -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.json' -o -name '*.md' -o -name '.htaccess' \) -size -100k | sort); do
            echo; echo "=================== $f ==================="
            cat "dl/$f"
          done
