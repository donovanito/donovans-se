name: List one.com webroots

# Helper for adding a new subdomain: shows the folders under webroots/ and
# what is inside each, so you can tell which one belongs to the new subdomain.

on:
  workflow_dispatch: {}

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List webroots over SFTP
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -e "set sftp:auto-confirm true; open -u \"$SFTP_USER\",\"$SFTP_PASS\" sftp://$SFTP_HOST:22; cls -l webroots/; bye"
          for d in $(lftp -e "set sftp:auto-confirm true; open -u \"$SFTP_USER\",\"$SFTP_PASS\" sftp://$SFTP_HOST:22; cls -1 webroots/; bye" | tr -d '/'); do
            echo "=== webroots/$d/ ==="
            lftp -e "set sftp:auto-confirm true; open -u \"$SFTP_USER\",\"$SFTP_PASS\" sftp://$SFTP_HOST:22; cls -1 -a webroots/$d/; bye" | head -15
          done
