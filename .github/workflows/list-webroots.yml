name: List one.com webroots

# Helper for adding a new subdomain: shows the folders under webroots/ and
# what is inside each, so you can tell which one belongs to the new subdomain.

on:
  workflow_dispatch: {}

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List webroots over SFTP
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          sftp() { lftp -e "set sftp:auto-confirm true; open -u \"$SFTP_USER\",\"$SFTP_PASS\" sftp://$SFTP_HOST:22; $1; bye"; }
          echo "=== webroots/ ==="
          sftp "cls -l webroots/"
          echo "=== webroots/by-route/ (maps hostnames to folders) ==="
          sftp "cls -l webroots/by-route/"
          for d in $(sftp "cls -1 webroots/" | sed 's#.*/##; s/[@/]*$//' | grep -v '^by-route$'); do
            echo "=== webroots/$d/ ==="
            sftp "cls -1 -a webroots/$d/" | head -15
          done
